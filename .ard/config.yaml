# ard configuration for albertcbrown/ard (dogfooding). Started from `ard init`'s
# template; human-owned. ard serve reads it from origin/main.
# Anything unset takes its built-in default (docs/proposal.md, Configuration).
# Validate with `ard config check`. ard serve reads this file from origin/main.

# label: only issues a maintainer labels for triage enter the pipeline.
# all: every human-filed issue enters.
intake: { mode: label }

# Loop poll intervals. Unset loops keep their defaults (scanners 4h, triage
# 15m, workers 5m, reviewers 5m, prwatch 5m); 1m is the minimum. Hand-offs
# no longer wait for a poll: a close-out wakes the next loop, a freed slot
# wakes loops with waiting work, and approvals and unblocks are watched every
# minute (#394, #406). The merger is controller code with no agent or job
# slot, so it polls every minute to merge green PRs sooner.
intervals: { merger: 1m }

merge:
  # A PR touching any of these waits for a human approval. There is no
  # built-in list: removing an entry removes its gate. An entry ending in /
  # is a directory prefix; anything else is a glob (quote globs starting with *).
  protected_paths:
    - .github/
    - .ard/config.yaml
    - .ard/scanners/
    - .ard/triage/
    - .ard/workers/
    - .ard/reviewers/
    - "**/CODEOWNERS"
    # Agent instructions a PR could plant to steer later agents.
    - CLAUDE.md
    - "**/CLAUDE.md"
    - AGENTS.md
    - "**/AGENTS.md"
    - .claude/
    - .mcp.json
    # What builds, signs and deploys ard itself (docs/proposal.md, Delivery).
    - "Jenkinsfile*"
    - Dockerfile
    - .dockerignore
    - deploy/

overrides:
  scanners/cve: { every: 6h, max_open: 10, group_size: 1, autoclose: true }
  # Phase 1 agent roles (the ard init starter set, #39 Gate 2).
  triage/lead:  { model: claude-opus-5-5, timeout: 15m }
  triage/engineer: { model: claude-sonnet-5-5 }
  workers/engineer: { model: claude-sonnet-5-5, timeout: 60m, tests: make lint test }
  reviewers/eng-review: { model: claude-sonnet-5-5 }
