site_name: ard
site_description: Automated repository development
site_url: https://albertcbrown.github.io/ard/
repo_url: https://github.com/albertcbrown/ard
docs_dir: docs/site
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - search.suggest
plugins:
  - search
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Install: install.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Roles:
      - Roles overview: roles/index.md
      - Scanners: roles/scanners.md
      - Triage: roles/triage.md
      - Workers: roles/workers.md
      - Reviewers: roles/reviewers.md
  - Operations:
      - operations.md
      - Gate 2 runbook: operations/gate-2-runbook.md
  - Security model: security.md
  - Troubleshooting: troubleshooting.md
