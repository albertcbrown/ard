# ard configuration, proposed by `ard init`. Edit freely; this file is yours.
# Anything unset takes its built-in default (docs/proposal.md, Configuration).
# Validate with `ard config check`. ard serve reads this file from origin/main.

# label: only issues a maintainer labels for triage enter the pipeline.
# all: every human-filed issue enters.
intake: { mode: label }

merge:
  # A PR touching any of these waits for a human approval. There is no
  # built-in list: removing an entry removes its gate. An entry ending in /
  # is a directory prefix; anything else is a glob (quote globs starting with *).
  protected_paths:
    - .github/
    - .ard/config.yaml
    # ard init records the starter hashes here; editing it changes what init may overwrite.
    - .ard/ard-init.lock
    - .ard/scanners/
    - .ard/triage/
    - .ard/workers/
    - .ard/reviewers/
    # Repo context docs every agent reads; a PR could plant instructions in them.
    - .ard/PRODUCT.md
    - .ard/VISION.md
    - .ard/TECH_STACK.md
    - "**/CODEOWNERS"
    # Agent instructions a PR could plant to steer later agents.
    - CLAUDE.md
    - "**/CLAUDE.md"
    - AGENTS.md
    - "**/AGENTS.md"
    - .claude/
    - .mcp.json
    # Linter config a PR could weaken: disabling a linter silently autocloses its issues.
    - "**/.golangci.yml"
    - "**/.golangci.yaml"
    - "**/.golangci.toml"
    - "**/.golangci.json"

overrides:
  scanners/cve: { every: 6h, max_open: 10, group_size: 1, autoclose: true }
  scanners/lts: { every: 7d, max_open: 5, group_size: 1, autoclose: true }
  scanners/docs: { every: 3d, max_open: 3, group_size: 10, autoclose: true }
  scanners/error-codes: { every: 24h, group_size: 20, autoclose: true }
  scanners/missing-tests: { every: 24h, max_open: 5, group_size: 10, autoclose: true }
  # needs a human-made `baseline` next to `scan`; see its Dockerfile
  scanners/lint: { every: 24h, max_open: 3, group_size: 20, autoclose: true }
  # Leaked credentials go straight to a human: route: needs-human files without
  # ard:pending, so no agent triages them.
  scanners/trufflehog: { every: 24h, max_open: 5, group_size: 1, autoclose: true, route: needs-human, timeout: 30m }
  # Full git history (read-only mount of the clone); history never goes away, so no autoclose.
  scanners/trufflehog-history: { every: 7d, max_open: 5, group_size: 1, autoclose: false, route: needs-human, timeout: 60m }
  triage/lead:  { model: claude-opus-5-5, timeout: 15m }
  triage/product-manager: { model: claude-opus-5-5 }
  triage/architect: { model: claude-opus-5-5, after: [product-manager] }
  triage/designer: { model: claude-haiku-5-5 }
  triage/documentation-planner: { model: claude-haiku-5-5, after: [designer] }
  triage/engineer: { model: claude-sonnet-5-5, after: [architect, documentation-planner] }
  # timeout covers the whole worker job (agent, tests, fix rounds). tests is your
  # repo's test command; "" turns the test step off. Over diff_warn_lines changed
  # lines the PR goes ahead with a "Large change" note; over diff_max_lines it is
  # held for a human.
  workers/engineer: { model: claude-sonnet-5-5, timeout: 60m, tests: make lint test, diff_warn_lines: 2000, diff_max_lines: 3000 }
  reviewers/eng-review: { model: claude-sonnet-5-5 }
  reviewers/security-review: { model: claude-opus-5-5 }
  # Runs only when a dependency manifest or lockfile changes. allowlist.txt in
  # its directory (or a sidecar's licenses/allowlist.txt) is the license policy.
  reviewers/license-review: { model: claude-sonnet-5-5, when: { paths: ["**/go.mod", "**/go.sum", "**/package.json", "**/package-lock.json", "**/npm-shrinkwrap.json"] } }
  # Runs when the issue had product-manager triage. To also run it for UI
  # changes, add paths, for example: when: { triage: [product-manager], paths: ["web/**", "ui/**"] }
  reviewers/product-manager-review: { model: claude-sonnet-5-5, when: { triage: [product-manager] } }
