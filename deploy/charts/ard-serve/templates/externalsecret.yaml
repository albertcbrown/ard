{{- /*
The ard GitHub App credentials through External Secrets: one dataFrom extract of one item, refreshed
periodically. The template names the three keys the Deployment reads. Off by default: then the Secret
githubApp.secretName must exist already.
*/ -}}
{{- $es := .Values.githubApp.externalSecret -}}
{{- if $es.enabled }}
{{- if not $es.storeName }}{{ fail "githubApp.externalSecret.storeName is required when enabled" }}{{ end }}
{{- if not $es.itemId }}{{ fail "githubApp.externalSecret.itemId is required when enabled" }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.githubApp.secretName }}
  labels:
    {{- include "ard-serve.labels" . | nindent 4 }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $es.storeName }}
  target:
    name: {{ .Values.githubApp.secretName }}
    creationPolicy: Owner
    template:
      data:
        ARD_GITHUB_APP_ID: {{ "{{ .ARD_GITHUB_APP_ID }}" | quote }}
        ARD_GITHUB_INSTALLATION_ID: {{ "{{ .ARD_GITHUB_INSTALLATION_ID }}" | quote }}
        private-key.pem: {{ "{{ index . \"private-key.pem\" }}" | quote }}
  dataFrom:
    - extract:
        key: {{ $es.itemId }}{{ with $es.itemTitle }}  # {{ . }}{{ end }}
{{- end }}
