{{- /*
The model credential through External Secrets (#434): one field of one store item, refreshed periodically,
written to modelCredential.secretName under modelCredential.key (default: the env name). Executor k8s only.
Off by default: then the Secret must exist already.
*/ -}}
{{- $mc := .Values.modelCredential | default dict -}}
{{- $es := $mc.externalSecret | default dict -}}
{{- if and (include "ard-serve.k8s" .) $es.enabled }}
{{- if not $mc.secretName }}{{ fail "modelCredential.secretName is required when modelCredential.externalSecret is enabled" }}{{ end }}
{{- if not $es.storeName }}{{ fail "modelCredential.externalSecret.storeName is required when enabled" }}{{ end }}
{{- if not $es.itemId }}{{ fail "modelCredential.externalSecret.itemId is required when enabled" }}{{ end }}
{{- if not $es.property }}{{ fail "modelCredential.externalSecret.property is required when enabled" }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $mc.secretName }}
  labels:
    {{- include "ard-serve.labels" . | nindent 4 }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ $es.refreshInterval | default "4h" }}
  secretStoreRef:
    kind: {{ $es.storeKind | default "ClusterSecretStore" }}
    name: {{ $es.storeName }}
  target:
    name: {{ $mc.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $mc.key | default $mc.env }}
      remoteRef:
        key: {{ $es.itemId }}{{ with $es.itemTitle }}  # {{ . }}{{ end }}
        property: {{ $es.property }}
{{- end }}
