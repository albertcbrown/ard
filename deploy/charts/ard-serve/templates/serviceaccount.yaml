{{- /* executor k8s: the controller's ServiceAccount (bound only to the Role in jobs-rbac.yaml) and the job pods'
ard-job (internal/executor/kube/pod.go ServiceAccountName), which has no binding. Neither is automounted: the controller
mounts a short-lived projected token explicitly, job pods mount none. */ -}}
{{- if include "ard-serve.k8s" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ard-serve.name" . }}
  labels:
    {{- include "ard-serve.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ard-job
  namespace: {{ include "ard-serve.jobsNamespace" . }}
  labels:
    {{- include "ard-serve.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
