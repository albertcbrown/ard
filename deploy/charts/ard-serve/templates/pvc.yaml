{{- /* HOME of the pod: ~/.ard (state, dry-run ledger, config snapshots, locks, pause file), the repo clone and the
Go caches. Kept when the Application is deleted, so the soak ledger is never lost by a sync.
storage.accessMode: live needs ReadWriteOncePod, so one pod at a time holds the flock. Access modes are immutable on a
bound claim, so an existing ReadWriteOnce home is migrated by hand: scale the Deployment to 0; create a claim
<name>-home-v2 with ReadWriteOncePod; copy the volume with a one-off pod that mounts both (cp -a, as uid 65532); point
the Deployment's claimName at -home-v2 (keep the old claim until the new one is checked); scale back to 1. */ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ard-serve.name" . }}-home
  labels:
    {{- include "ard-serve.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.storage.accessMode }}]
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
