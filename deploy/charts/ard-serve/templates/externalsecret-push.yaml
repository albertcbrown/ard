{{- /*
The role image push credential through External Secrets (#448): a kubernetes.io/dockerconfigjson Secret in the build
namespace, built from one store item's username and token fields, for roleImages.repository's registry host. Only
builder pods mount it (the build namespace's admission policy). Off by default: then the Secret must exist already.
*/ -}}
{{- $ri := .Values.roleImages -}}
{{- $es := $ri.pushSecret.externalSecret | default dict -}}
{{- if and (include "ard-serve.roleImages" .) $es.enabled }}
{{- if not $es.storeName }}{{ fail "roleImages.pushSecret.externalSecret.storeName is required when enabled" }}{{ end }}
{{- if not $es.itemId }}{{ fail "roleImages.pushSecret.externalSecret.itemId is required when enabled" }}{{ end }}
{{- range $p := list "usernameProperty" "tokenProperty" }}
{{- if not (regexMatch "^[-._A-Za-z0-9 ]+$" (toString (index $es $p))) }}{{ fail (printf "roleImages.pushSecret.externalSecret.%s must be a field name" $p) }}{{ end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $ri.pushSecret.secretName }}
  namespace: {{ include "ard-serve.buildNamespace" . }}
  labels:
    {{- include "ard-serve.labels" . | nindent 4 }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ $es.refreshInterval | default "4h" }}
  secretStoreRef:
    kind: {{ $es.storeKind | default "ClusterSecretStore" }}
    name: {{ $es.storeName }}
  target:
    name: {{ $ri.pushSecret.secretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"auth\":\"{{ printf \"%%s:%%s\" .username .token | b64enc }}\"}}}" (include "ard-serve.roleRegistry" .) | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $es.itemId }}{{ with $es.itemTitle }}  # {{ . }}{{ end }}
        property: {{ $es.usernameProperty }}
    - secretKey: token
      remoteRef:
        key: {{ $es.itemId }}
        property: {{ $es.tokenProperty }}
{{- end }}
