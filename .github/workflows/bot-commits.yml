# Detective control for the main-lane committer (docs/proposal.md, "The .ard/
# contract"). The bot bypasses branch protection on main, so this audits the
# first-parent history of main and fails when a commit made by the bot changes
# anything except regular files under a single .ard/<issue#>/ directory.
#
# The bot login and the optional baseline come from repository variables, which
# the GitHub App cannot write. The App also lacks the `workflows` permission,
# so it cannot edit this file. Both are why the logic is inline bash here and
# not Go. internal/botcheck extracts the script below and tests it.
name: ard bot commits

on:
  push:
    branches: [main]
  # Main-lane bot pushes carry [skip ci], which suppresses the push trigger, so
  # a schedule is what catches a stretch of history made only of bot commits.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - id: check
        shell: bash
        env:
          BOT_LOGIN: ${{ vars.ARD_BOT_LOGIN }}
          BRANCH: main
          SINCE: ${{ vars.ARD_BOT_CHECK_SINCE }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          # Exit 0: clean. 1: a bot commit left .ard/<issue#>/. 2: cannot check.
          if [[ -z "${BOT_LOGIN:-}" ]]; then
            echo "::error title=ard bot commits::set the ARD_BOT_LOGIN repository variable to the App's <slug>[bot] login"
            exit 2
          fi
          branch=${BRANCH:-main}
          since=${SINCE:-}
          limit=${LIMIT:-500}
          head_ref="refs/remotes/origin/$branch"

          cannot() { echo "::error title=ard bot commits::cannot check: $1"; exit 2; }
          esc() {
            local s=$1
            s=${s//'%'/%25}
            s=${s//$'\r'/%0D}
            s=${s//$'\n'/%0A}
            printf '%s' "$s"
          }

          [[ "$(git rev-parse --is-shallow-repository)" == false ]] || cannot "shallow clone"
          git rev-parse -q --verify "$head_ref^{commit}" >/dev/null || cannot "$head_ref is missing"
          if [[ -n "$since" ]]; then
            git rev-parse -q --verify "$since^{commit}" >/dev/null || cannot "ARD_BOT_CHECK_SINCE $since is not a commit"
            git merge-base --is-ancestor "$since" "$head_ref" || cannot "ARD_BOT_CHECK_SINCE $since is not an ancestor of $head_ref"
            range=("$since..$head_ref")
            from=$since
          else
            range=(-n "$limit" "$head_ref")
            from="last $limit"
          fi

          log=$(git log --first-parent --format='%H%x1f%ce%x1f%cn' "${range[@]}")
          tmp=$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/botcheck.XXXXXX")
          trap 'rm -f "$tmp"' EXIT

          suffix="+${BOT_LOGIN}@users.noreply.github.com"
          path_re='^\.ard/([1-9][0-9]*)/[^/]+(/[^/]+)*$'
          checked=0
          violations=0

          report() { # sha path reason
            violations=$((violations + 1))
            echo "::error title=ard bot commit outside .ard/<issue#>/::$1 $(esc "$2"): $3"
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              local p=${2//'`'/\'}
              p=${p//'|'/\\|}
              p=${p//$'\n'/ }
              p=${p//$'\r'/ }
              printf '| %s | `%s` | %s |\n' "$1" "$p" "$3" >>"$GITHUB_STEP_SUMMARY"
            fi
          }

          if [[ -n "$log" ]]; then
            last=""
            nlog=0
            while IFS=$'\x1f' read -r sha ce cn; do
              nlog=$((nlog + 1))
              bot=0
              # Case-insensitive; the legacy <login>@users.noreply form and any
              # control character in the identity (fail closed) also count.
              shopt -s nocasematch
              [[ "$cn" == "$BOT_LOGIN" ]] && bot=1
              [[ "$ce" == "$BOT_LOGIN@users.noreply.github.com" ]] && bot=1
              if [[ "$ce" == *"$suffix" ]]; then
                prefix=${ce:0:$((${#ce} - ${#suffix}))}
                [[ -n "$prefix" && "$prefix" != *[!0-9]* ]] && bot=1
              fi
              shopt -u nocasematch
              [[ "$cn" == *[[:cntrl:]]* || "$ce" == *[[:cntrl:]]* ]] && bot=1
              last=$bot
              [[ $bot == 1 ]] || continue
              checked=$((checked + 1))

              parents=$(git rev-list --parents -n1 "$sha")
              set -- $parents
              if [[ $# -gt 2 ]]; then
                report "$sha" "(commit)" "merge commit"
              fi
              if [[ $# -ge 2 ]]; then
                git diff-tree -r -z --raw --no-renames --no-abbrev --no-commit-id "$2" "$sha" >"$tmp"
              else
                git diff-tree -r -z --raw --no-renames --no-abbrev --no-commit-id --root "$sha" >"$tmp"
              fi

              issue=""
              while IFS= read -r -d '' meta && IFS= read -r -d '' p; do
                set -- $meta
                mode=$2
                reason=""
                if [[ "$p" == *[[:cntrl:]]* || "$p" == *'\'* ]]; then
                  reason="backslash or control character"
                elif [[ ! "$p" =~ $path_re ]]; then
                  reason="outside .ard/<issue#>/"
                else
                  n=${BASH_REMATCH[1]}
                  IFS=/ read -r -a segs <<<"$p"
                  for s in "${segs[@]}"; do
                    case "$s" in
                      . | ..) reason="not canonical" ;;
                    esac
                    shopt -s nocasematch
                    [[ "$s" == .git ]] && reason="contains .git"
                    shopt -u nocasematch
                  done
                  if [[ -z "$reason" ]]; then
                    if [[ -z "$issue" ]]; then
                      issue=$n
                    elif [[ "$issue" != "$n" ]]; then
                      reason="commit also touches issue $issue"
                    fi
                  fi
                  if [[ -z "$reason" ]]; then
                    case "$mode" in
                      100644 | 100755 | 000000) ;;
                      *) reason="unsupported mode $mode" ;;
                    esac
                  fi
                fi
                [[ -z "$reason" ]] || report "$sha" "$p" "$reason"
              done <"$tmp"
            done <<<"$log"
          fi

          if [[ -z "$since" && "${nlog:-0}" -ge "$limit" && "${last:-0}" == 1 ]]; then
            echo "::error title=ard bot commits::window full of bot commits; set ARD_BOT_CHECK_SINCE"
            echo "checked $checked bot commit(s) on origin/$branch since $from: $violations violation(s)"
            exit 2
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && $violations -gt 0 ]]; then
            { echo; echo "Rows above: bot commits that left .ard/<issue#>/."; } >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "checked $checked bot commit(s) on origin/$branch since $from: $violations violation(s)"
          [[ $violations -eq 0 ]] || exit 1
