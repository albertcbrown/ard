name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - name: Real fixtures gate
        run: test ! -e internal/agent/claude/testdata/REAL_FIXTURES_PENDING || { echo "::error::real fixtures not captured (testdata/CAPTURE.md)"; exit 1; }
      - run: make build
